; 真随机出厂默认配置（随包分发，升级会被覆盖）。
; 玩家可改的设置请勿写在这里：同目录 H3RndNew.user.ini 会叠加覆盖本文件。

[General]
; 新游戏选图界面「开局真随机」的出厂勾选。
; 0 = 不勾（原版伪随机）
; 1 = 勾上（真随机，默认）
; 玩家在界面上改过之后写入 H3RndNew.user.ini，以玩家层为准。
TrueRandom=1
; 全局真随机（游戏内按热键打开设置窗切换）：
; 0 = 关闭（仅新游戏建档期间替换，默认）
; 1 = 全程替换（含战斗等所有随机数；联机锁定回合时勿开）
TrueRandomFull=0
; 设置窗热键的键盘扫描码（=游戏内部键码）：默认 87 = F11。
; 常用：F1..F10 = 59..68，F11 = 87，F12 = 88（被 SoD_SP 占用，勿用），
; A..Z = 30..55，1..9 = 2..10，0 = 11。游戏内设置窗里可直接改键。
SettingsHotkeyScan=87

[BankMaximize]
; 宝屋最大化出厂默认勾选状态：0=不勾，1=勾上。
Enabled=0
; 替换比例千分比，0..1000；1000=100%。
Ratio=1000

[WarehouseUI]
; 仓库界面布局偏移（像素，round-7 新增）。玩家改这里请写入 H3RndNew.user.ini
; 同名节，弹窗下次打开即生效（无需重启游戏）；超出安全范围会回退默认值。
; 背包界面左上角的“仓库”按钮：
OpenButtonDX=18
OpenButtonDY=18
; 仓库界面右上角的关闭X（水平距右缘 / 距顶部）：
CloseButtonDX=18
CloseButtonDY=18
; 一键放入距仓库左边 / 一键取出距仓库右边 / 两个一键按钮距仓库顶部：
BulkButtonLeftDX=18
BulkButtonRightDX=44
BulkButtonDY=18
; 页签显示顺序（round-11 新增）：逗号分隔的页签名，必须恰好是下面 12 个且不重复，
; 否则整体回退代码内置默认顺序（日志里会打出“页签顺序配置无效”与两条 raw/生效行）。
; 可用页签名：常规 卷轴 装备 头部 肩部 项链 武器 盾牌 胸甲 戒指 靴子 杂物
; 默认顺序＝常规、卷轴，随后按穿戴位置“杂物→头部”倒序，装备放在最后。
TabOrder=常规,卷轴,杂物,靴子,戒指,胸甲,盾牌,武器,项链,肩部,头部,装备

[Logging]
; DisableLog=1 完全关闭日志；MinLevel=最小记录级别（trace/debug/info/warn/error）
; 玩家改动请写进 H3RndNew.user.ini 的同名节。
DisableLog=0
MinLevel=info
